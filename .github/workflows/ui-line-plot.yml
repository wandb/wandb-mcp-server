name: MCP Apps UI

on:
  push:
    branches: [main, "staging/**"]
    paths:
      - "ui/**"
      - "src/wandb_mcp_server/data/*.html"
      - "src/wandb_mcp_server/data/THIRD_PARTY_NOTICES.txt"
      - "src/wandb_mcp_server/mcp_tools/line_plot*.py"
      - "src/wandb_mcp_server/mcp_tools/agent_conversation_app.py"
      - "src/wandb_mcp_server/mcp_tools/agent_lens_insights_app.py"
      - "src/wandb_mcp_server/mcp_tools/aria*.py"
      - ".github/workflows/ui-line-plot.yml"
  pull_request:
    branches: [main, "staging/**", "feat/**"]
    paths:
      - "ui/**"
      - "src/wandb_mcp_server/data/*.html"
      - "src/wandb_mcp_server/data/THIRD_PARTY_NOTICES.txt"
      - "src/wandb_mcp_server/mcp_tools/line_plot*.py"
      - "src/wandb_mcp_server/mcp_tools/agent_conversation_app.py"
      - "src/wandb_mcp_server/mcp_tools/agent_lens_insights_app.py"
      - "src/wandb_mcp_server/mcp_tools/aria*.py"
      - ".github/workflows/ui-line-plot.yml"

permissions:
  contents: read

concurrency:
  group: ui-mcp-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ui:
    name: Typecheck, Vitest, Reproducible Bundles, and AppBridge Browser Tests
    runs-on: ubuntu-26.04-2-cores
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI workspace dependencies
        run: npm ci

      - name: Typecheck and run Vitest unit suites
        run: |
          npm run typecheck
          npm test

      - name: Verify reproducible single-file bundles and third-party notices
        run: |
          npm run build
          git -C .. diff --exit-code -- \
            src/wandb_mcp_server/data/line-plot.html \
            src/wandb_mcp_server/data/agent-conversation.html \
            src/wandb_mcp_server/data/agent-lens-insights.html \
            src/wandb_mcp_server/data/aria-agent.html \
            src/wandb_mcp_server/data/THIRD_PARTY_NOTICES.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run sandboxed AppBridge iframe browser suites
        run: npm run test:browser
