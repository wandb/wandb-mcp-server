name: Line Plot MCP App UI

on:
  push:
    branches: [main, "staging/**"]
    paths:
      - "ui/line-plot/**"
      - "src/wandb_mcp_server/data/line-plot.html"
      - "src/wandb_mcp_server/data/THIRD_PARTY_NOTICES.txt"
      - "src/wandb_mcp_server/mcp_tools/line_plot*.py"
      - ".github/workflows/ui-line-plot.yml"
  pull_request:
    branches: [main, "staging/**"]
    paths:
      - "ui/line-plot/**"
      - "src/wandb_mcp_server/data/line-plot.html"
      - "src/wandb_mcp_server/data/THIRD_PARTY_NOTICES.txt"
      - "src/wandb_mcp_server/mcp_tools/line_plot*.py"
      - ".github/workflows/ui-line-plot.yml"

permissions:
  contents: read

concurrency:
  group: ui-line-plot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ui:
    name: Typecheck, Vitest, Reproducible Bundle, and AppBridge Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/line-plot

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/line-plot/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci

      - name: Typecheck and run Vitest unit suite
        run: |
          npm run typecheck
          npm test

      - name: Verify reproducible single-file bundle and third-party notices
        run: |
          npm run build
          git -C ../.. diff --exit-code -- src/wandb_mcp_server/data/line-plot.html src/wandb_mcp_server/data/THIRD_PARTY_NOTICES.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run sandboxed AppBridge iframe browser suite
        run: npm run test:browser
