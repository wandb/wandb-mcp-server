name: CI

on:
  push:
    branches: [main, "staging/**"]
  pull_request:
    branches: [main, "staging/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.11.27"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra test --python ${{ matrix.python-version }}

      - name: Smoke test package import
        run: uv run --no-sync python -c "import wandb_mcp_server; print('ok')"

      - name: Lint with ruff
        run: |
          uv run --no-sync ruff check src/ tests/
          uv run --no-sync ruff format --check src/ tests/

      - name: Run unit tests
        run: uv run --no-sync pytest tests/ -m "not integration" -x -v --tb=short -q
        env:
          WANDB_SILENT: "True"
          WEAVE_SILENT: "True"

      - name: Build and smoke test wheel install
        run: |
          uv build
          SMOKE_ENV="$RUNNER_TEMP/wandb-mcp-install-smoke"
          uv venv "$SMOKE_ENV" --python ${{ matrix.python-version }}
          uv pip install --python "$SMOKE_ENV/bin/python" dist/*.whl
          "$SMOKE_ENV/bin/python" -c "import wandb_mcp_server; print('ok')"
          WANDB_MCP_ENABLE_RAW_GRAPHQL=true "$SMOKE_ENV/bin/python" -c "from mcp.server.fastmcp import FastMCP; from wandb_mcp_server.server import register_tools; mcp = FastMCP('smoke'); register_tools(mcp); assert 'query_wandb_graphql_tool' in mcp._tool_manager._tools; print('raw graphql ok')"
        env:
          WANDB_SILENT: "True"
          WEAVE_SILENT: "True"

  wandb-latest-compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.11.27"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project and latest W&B SDKs
        run: |
          uv sync --frozen --extra test --python 3.12
          uv pip install --python .venv/bin/python --upgrade "wandb[workspaces]" wandb-workspaces

      - name: Show installed W&B SDK versions
        run: uv run --no-sync python -c "from importlib.metadata import version; print('wandb', version('wandb')); print('wandb-workspaces', version('wandb-workspaces'))"

      - name: Verify latest W&B SDK and optional GraphQL compatibility
        run: |
          uv run --no-sync pytest \
            tests/test_query_wandb_sdk.py \
            tests/test_probe_project.py \
            tests/test_wandb_selective_reads.py \
            tests/test_tool_registration.py \
            tests/test_wandb_graphql.py \
            tests/test_wandb_graphql_read_only.py \
            tests/test_hosted_gql_guardrails.py \
            tests/test_hosted_gql_production_errors.py \
            -k "not locked_wandb_versions_are_installed" \
            -x -v --tb=short -q
        env:
          WANDB_SILENT: "True"
          WEAVE_SILENT: "True"
