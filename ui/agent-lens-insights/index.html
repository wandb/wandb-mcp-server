<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Lens Insights</title>
  </head>
  <body>
    <div id="app-root" class="ali-shell" data-display-mode="inline">
      <header class="ali-header">
        <div class="ali-header-left">
          <div class="ali-title-group">
            <span class="ali-page-label">Insights</span>
            <span class="ali-sep" aria-hidden="true">/</span>
            <h1 id="ali-title" class="ali-title">Loading…</h1>
            <span id="ali-agent-pill" class="ali-subtle-badge" hidden></span>
            <span id="ali-busy-pill" class="ali-subtle-badge" hidden>Updating…</span>
          </div>

          <nav id="ali-toolbar" class="ali-toolbar" aria-label="Insights sections" hidden>
            <div class="ali-tabs" role="tablist">
              <button id="ali-tab-failures" type="button" role="tab" class="ali-tab" aria-selected="true">
                Agent failures
              </button>
              <button id="ali-tab-intents" type="button" role="tab" class="ali-tab" aria-selected="false">
                User intents
              </button>
            </div>
          </nav>
        </div>

        <div class="ali-actions">
          <div id="ali-window-group" class="ali-window-group" role="group" aria-label="Time window presets" hidden>
            <button type="button" class="ali-preset-btn" data-days="1">24h</button>
            <button type="button" class="ali-preset-btn" data-days="7">7d</button>
            <button type="button" class="ali-preset-btn" data-days="30">30d</button>
          </div>
          <button id="ali-expand-btn" type="button" class="ali-btn ali-btn-ghost" hidden>Expand</button>
          <button id="ali-open-forge-btn" type="button" class="ali-btn" hidden>
            Open in Agent Lens ↗
          </button>
        </div>
      </header>

      <div id="ali-kpi-strip" class="ali-meta-bar" hidden></div>

      <div id="ali-banner" class="ali-banner" role="status" aria-live="polite" hidden>
        <span id="ali-banner-text"></span>
        <button id="ali-banner-dismiss" type="button" class="ali-banner-dismiss" aria-label="Dismiss notice">✕</button>
      </div>

      <main id="ali-main" class="ali-main">
        <div id="ali-empty" class="ali-empty" role="status">Waiting for Agent Lens insights…</div>

        <div id="ali-workspace" class="ali-workspace" hidden>
          <section id="ali-top-clusters-section" class="ali-top-clusters-section" hidden>
            <div class="ali-section-header">
              <h2 class="ali-section-title">Top clusters</h2>
              <p id="ali-top-clusters-note" class="ali-section-note">
                Most common issues and errors from your agents.
              </p>
            </div>
            <div id="ali-top-clusters" class="ali-top-clusters-grid"></div>
          </section>

          <hr id="ali-section-divider" class="ali-divider" hidden />

          <section class="ali-explorer-section" aria-label="Categories and clusters">
            <div class="ali-section-header">
              <h2 id="ali-explorer-heading" class="ali-section-title">Failure categories and clusters</h2>
              <p id="ali-bar-caption" class="ali-section-note">
                Explore examples grouped by failure category and cluster.
              </p>
            </div>

            <div id="ali-pane-group" class="ali-pane-group">
              <aside id="ali-bars-list" class="ali-navigator" role="region" aria-label="Categories and clusters"></aside>
              <div id="ali-detail-pane" class="ali-detail-pane" role="region" aria-label="Cluster impact and example conversations"></div>
              <aside id="ali-conv-drawer" class="ali-conv-drawer" aria-label="Conversation preview" hidden></aside>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
